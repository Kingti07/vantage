plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
	group = project.maven_group
	version = project.project_version

	repositories {
		mavenCentral()
	}

	plugins.withType(JavaPlugin).configureEach {
		java {
			toolchain {
				languageVersion = JavaLanguageVersion.of(21)
			}
		}
		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = 21
		}
	}
}

// Quality gates for the launcher and the shared code (the Fabric client follows Minecraft's own conventions):
// Checkstyle (config/checkstyle/checkstyle.xml) and every javac lint warning treated as an error.
configure(subprojects.findAll { it.name in ['common', 'launcher'] }) {
	apply plugin: 'checkstyle'
	checkstyle {
		toolVersion = '12.3.1'
		configFile = rootProject.file('config/checkstyle/checkstyle.xml')
		maxWarnings = 0
	}
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs += ['-Xlint:all', '-Werror']
	}
}
