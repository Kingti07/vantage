plugins {
	id 'application'
}

base {
	archivesName = 'vantage-launcher'
}

// JavaFX ships per-platform native jars. Build for the current OS by default,
// or cross-build with -PjavafxPlatform=win|mac|mac-aarch64|linux|linux-aarch64.
def detectPlatform = {
	def os = System.getProperty('os.name').toLowerCase()
	def arch = System.getProperty('os.arch').toLowerCase()
	def arm = arch.contains('aarch64') || arch.contains('arm64')
	if (os.contains('win')) return 'win'
	if (os.contains('mac')) return arm ? 'mac-aarch64' : 'mac'
	return arm ? 'linux-aarch64' : 'linux'
}
def javafxPlatform = project.findProperty('javafxPlatform') ?: detectPlatform()

configurations {
	bundledClientMod {
		canBeConsumed = false
		canBeResolved = true
	}
}

dependencies {
	implementation project(':common')
	implementation "com.google.code.gson:gson:${gson_version}"
	implementation "org.slf4j:slf4j-api:${slf4j_version}"
	// Protects the sign-in token key with Windows DPAPI (see common KeyStorage).
	implementation "net.java.dev.jna:jna-platform:${jna_version}"
	runtimeOnly "org.slf4j:slf4j-simple:${slf4j_version}"

	['base', 'graphics', 'controls'].each { module ->
		implementation "org.openjfx:javafx-${module}:${javafx_version}:${javafxPlatform}"
	}

	bundledClientMod project(path: ':client', configuration: 'clientModJar')

	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

application {
	mainClass = 'dev.vantage.launcher.Main'
	applicationDefaultJvmArgs = ['-Xmx512m']
}

// The in-game client mod is bundled inside the launcher and installed into the instance on launch.
processResources {
	from(configurations.bundledClientMod) {
		into 'bundled'
		rename { 'vantage-client.jar' }
	}
}

// Single runnable jar: java -jar vantage-launcher-<version>-all.jar
tasks.register('fatJar', Jar) {
	group = 'build'
	description = 'Builds a self-contained launcher jar for the selected JavaFX platform.'
	archiveClassifier = "all-${javafxPlatform}"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes 'Main-Class': application.mainClass.get(), 'Implementation-Version': project.version
	}
	from sourceSets.main.output
	dependsOn configurations.runtimeClasspath
	from {
		configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
	}
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
}

tasks.named('assemble') { dependsOn 'fatJar' }

// Developer integration check of the complete install + launch pipeline (see LaunchSmoke).
tasks.register('launchSmoke', JavaExec) {
	group = 'verification'
	description = 'Installs Minecraft + Fabric + Vantage into a throwaway folder and starts the in-game smoke test.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.vantage.launcher.LaunchSmoke'
	def dir = project.findProperty('smokeDir') ?: layout.buildDirectory.dir('launch-smoke').get().asFile.absolutePath
	// -PsmokeMods=sodium,lithium installs extra Modrinth mods first, to test compatibility with them.
	// -PsmokeModpack=fabulously-optimized installs a Modrinth modpack into a new installation and starts that one.
	// -PsmokeImport=<folder> copies a Modrinth App profile of this computer and starts that one.
	args dir, project.findProperty('smokeMods') ?: '', project.findProperty('smokeModpack') ?: '', project.findProperty('smokeImport') ?: ''
}

// Developer FPS benchmark (see LaunchBenchmark): -PbenchDir=<folder> -PbenchProfile=vanilla|pack|vulkan -PbenchSeconds=30
tasks.register('launchBenchmark', JavaExec) {
	group = 'verification'
	description = 'Measures FPS of Vantage in a fixed test world, optionally with performance mods.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.vantage.launcher.LaunchBenchmark'
	args(project.findProperty('benchDir') ?: layout.buildDirectory.dir('benchmark').get().asFile.absolutePath,
		project.findProperty('benchProfile') ?: 'vanilla', project.findProperty('benchSeconds') ?: '30',
		project.findProperty('benchRd') ?: '12', project.findProperty('benchMods') ?: '', project.findProperty('benchPreset') ?: 'false')
}

// Portable version: the launcher together with its own Java runtime, so players need no installed Java.
// jpackage cannot cross-build, so run this on the operating system the package is for:
//   ./gradlew :launcher:portableZip   ->   build/distributions/vantage-launcher-<version>-portable-<platform>.zip
// The runtime keeps bin/java (no --strip-native-commands) because the self-updater starts new versions with it.
def osName = System.getProperty('os.name').toLowerCase()
def isWindows = osName.contains('win')
def isMac = osName.contains('mac')
def portableInput = layout.buildDirectory.dir('portable/input')
def portableImageDir = layout.buildDirectory.dir('portable/image')
def runtimeModules = 'java.base,java.desktop,java.logging,java.net.http,java.sql,jdk.jfr,jdk.management,jdk.unsupported,' +
	'jdk.crypto.ec,jdk.localedata,jdk.charsets'

tasks.register('portableImage', Exec) {
	group = 'distribution'
	description = 'Builds a self-contained application folder (launcher + Java runtime) for this operating system.'
	def fatJarTask = tasks.named('fatJar', Jar)
	dependsOn fatJarTask
	inputs.files(fatJarTask)
	inputs.dir('packaging')
	outputs.dir(portableImageDir)
	executable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
		.metadata.installationPath.file("bin/jpackage${isWindows ? '.exe' : ''}").asFile.absolutePath
	def icon = file("packaging/vantage.${isWindows ? 'ico' : isMac ? 'icns' : 'png'}")
	args '--type', 'app-image', '--name', 'Vantage', '--vendor', 'Vantage',
		'--description', 'Vantage Minecraft PvP launcher',
		'--input', portableInput.get().asFile.absolutePath, '--main-jar', 'vantage-launcher.jar',
		'--main-class', 'dev.vantage.launcher.Main', '--java-options', '-Xmx512m',
		'--add-modules', runtimeModules, '--jlink-options', '--strip-debug --no-man-pages --no-header-files',
		'--icon', icon.absolutePath, '--dest', portableImageDir.get().asFile.absolutePath
	if (!isMac) {
		// macOS requires an app version starting with 1 or higher; it falls back to 1.0 there.
		args '--app-version', project.version
	}
	doFirst {
		delete portableInput, portableImageDir
		copy {
			from fatJarTask
			into portableInput
			rename { 'vantage-launcher.jar' }
		}
	}
}

tasks.register('portableZip', Zip) {
	group = 'distribution'
	description = 'Zips the portable application folder for release.'
	dependsOn 'portableImage'
	from portableImageDir
	archiveFileName = "vantage-launcher-${project.version}-portable-${javafxPlatform}.zip"
	destinationDirectory = layout.buildDirectory.dir('distributions')
}
