name: Release

# Builds, tests and publishes a GitHub release whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Launcher jars for every platform
        run: |
          for platform in win mac mac-aarch64 linux; do
            ./gradlew :launcher:fatJar -PjavafxPlatform=$platform --console=plain
          done

      - name: Collect release files
        run: |
          mkdir dist
          cp launcher/build/libs/*-all-*.jar dist/
          cp client/build/libs/vantage-client-*.jar dist/
          cd dist
          sha256sum *.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vantage ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease
