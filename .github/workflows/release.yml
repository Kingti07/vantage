name: Release

# Builds, tests and publishes a GitHub release whenever a version tag (v*) is pushed:
# launcher jars for every platform, portable packages with their own Java runtime (built on each OS, because
# jpackage cannot cross-build), the client mod and SHA256SUMS.txt.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  portable:
    name: Portable package (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac-aarch64
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build portable package
        shell: bash
        run: ./gradlew :launcher:portableZip -PjavafxPlatform=${{ matrix.platform }} --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: launcher/build/distributions/*-portable-*.zip
          if-no-files-found: error

  release:
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Launcher jars for every platform
        run: |
          for platform in win mac mac-aarch64 linux; do
            ./gradlew :launcher:fatJar -PjavafxPlatform=$platform --console=plain
          done

      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: dist
          merge-multiple: true

      - name: Collect release files
        run: |
          mkdir -p dist
          cp launcher/build/libs/*-all-*.jar dist/
          cp client/build/libs/vantage-client-*.jar dist/
          cd dist
          sha256sum *.jar *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vantage ${GITHUB_REF_NAME#v}" \
            --notes-file .github/RELEASE_NOTES.md \
            --prerelease
