name: CI

# Builds and tests every push and pull request: compile (lint warnings are errors), unit tests, Checkstyle and a
# check of the launcher's dependencies against the OSV vulnerability database.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and check
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build-output.txt

      # Logs need a GitHub login, annotations do not: this makes the cause of a failure visible on the run page.
      - name: Report failures as annotations
        if: failure()
        run: python3 .github/scripts/report-failures.py build-output.txt

      - name: Check dependencies for known vulnerabilities
        run: |
          ./gradlew -q :launcher:dependencies --configuration runtimeClasspath > launcher-dependencies.txt
          .github/scripts/osv-check.sh launcher-dependencies.txt
